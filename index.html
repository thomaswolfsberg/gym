<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Træningslog</title>
<meta name="theme-color" content="#141518">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Træning">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,400..800&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light dark;--bg:light-dark(#ffffff,#101112);--ink:light-dark(#141518,#f1f1ef);--mut:light-dark(#686b72,#9a9da4);--line:light-dark(#e3e3e0,#2a2c30);--field:light-dark(#f4f4f2,#1b1c1f);--acc:#d7261e;--ok:light-dark(#1d7a46,#3fb874);--accInk:#fff}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Archivo,system-ui,sans-serif;overflow-x:clip;-webkit-tap-highlight-color:transparent}
.wrap{max-width:640px;margin:0 auto;padding:max(20px,env(safe-area-inset-top)) max(4vw,16px) 60px}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;border-top:6px solid var(--ink);padding-top:14px}
h1{font-stretch:112%;font-weight:800;font-size:32px;line-height:1.05;margin:0}
.date{color:var(--mut);font-size:14px;text-align:right}
nav{display:flex;gap:6px;margin:18px 0 16px}
nav button,.chips button{flex:1;min-height:44px;border:2px solid var(--ink);background:none;color:var(--ink);font:600 16px Archivo,sans-serif;border-radius:10px;cursor:pointer;padding:0 12px}
nav button[aria-pressed=true],.chips button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.chips button{flex:0 0 auto;border-color:var(--line)}
label{display:block;font-size:14px;font-weight:600;margin-bottom:6px}
input,select{width:100%;min-height:48px;font:16px Archivo,sans-serif;border:2px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:8px 12px}
input:focus-visible,button:focus-visible,select:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.step{display:grid;grid-template-columns:44px minmax(0,1fr) 44px;gap:6px}
.step input{text-align:center;font-stretch:112%;font-weight:800;font-size:22px;padding:4px}
.step button{min-height:48px;border:0;border-radius:10px;background:var(--bg);color:var(--ink);font:700 22px Archivo,sans-serif;cursor:pointer;box-shadow:inset 0 0 0 2px var(--line)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.primary{flex:1;min-height:52px;border:0;border-radius:12px;background:var(--acc);color:var(--accInk);font:700 17px Archivo,sans-serif;cursor:pointer;padding:0 16px}
.ghost{min-height:48px;padding:0 16px;border:2px solid var(--line);border-radius:12px;background:none;color:var(--ink);font:600 15px Archivo,sans-serif;cursor:pointer}
.ghost.sure{background:var(--acc);border-color:var(--acc);color:var(--accInk)}
.add{width:100%;margin-top:10px;border-style:dashed}
h2{font-size:20px;font-weight:800;margin:26px 0 8px;font-stretch:108%}
ul{list-style:none;margin:0;padding:0}
.card{border:2px solid var(--line);border-radius:14px;margin-bottom:10px;overflow:hidden}
.card.done{border-color:var(--ok)}
.head{display:grid;grid-template-columns:30px minmax(0,1fr);gap:2px 10px;width:100%;text-align:left;background:none;border:0;color:var(--ink);font:inherit;padding:12px 14px;cursor:pointer}
.tick{grid-row:span 3;width:26px;height:26px;border-radius:50%;border:2px solid var(--line);margin-top:2px;position:relative}
.done .tick{background:var(--ok);border-color:var(--ok)}
.done .tick::after{content:"";position:absolute;left:8px;top:3px;width:6px;height:12px;border:solid #fff;border-width:0 3px 3px 0;transform:rotate(45deg)}
.name{font-weight:700;font-size:17px}
.nums{font-stretch:112%;font-weight:800;font-size:19px}
.sets{display:grid;gap:8px}
.sh,.sr{display:grid;grid-template-columns:22px minmax(0,1fr) minmax(0,1fr);gap:8px;align-items:center}
.sh span{font-size:13px;font-weight:600;color:var(--mut)}
.sn{font-weight:800;color:var(--mut);text-align:center}
.sr .step{grid-template-columns:40px minmax(0,1fr) 40px;gap:4px}.sr .step input{font-size:19px}
.pz{max-width:240px}
textarea{width:100%;min-height:76px;font:16px/1.4 Archivo,sans-serif;border:2px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:10px 12px;resize:vertical}
textarea:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.fnote{font-style:italic;color:var(--mut);font-size:14px}
.head>span:not(.tick){grid-column:2}
.dnote{font-size:14px;margin-top:2px}
.addnote{align-self:start;min-height:44px}
#hist.all .day{margin-top:30px;border-top:4px solid var(--ink);padding-top:10px}
#hist.all .day h3{font-size:20px;font-weight:800;color:var(--ink);font-stretch:108%;display:flex;justify-content:space-between;align-items:baseline;gap:10px}
#hist.all .day h3 small{font-size:14px;font-weight:500;color:var(--mut);white-space:nowrap}
.crow{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:start}.ctools{display:flex;flex-direction:column;gap:6px;padding:10px 10px 10px 0}
#chartBox{margin:16px 0 4px}
#chartBox .chips{margin-bottom:8px}
.msum{font-size:15px;margin:4px 0 8px}.msum b{font-stretch:112%;font-weight:800;font-size:19px}
.fig{position:relative;height:230px}.fig svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.ax{fill:var(--mut);font:12px Archivo,sans-serif}.gl{stroke:var(--line);stroke-width:1}
.ln{stroke:var(--acc);stroke-width:3;fill:none;stroke-linejoin:round}.pt{fill:var(--acc)}
.mnote{font-size:13px;color:var(--mut);margin:6px 0 0}
.nums small{font-weight:500;font-size:14px;color:var(--mut);font-stretch:100%}
.meta{color:var(--mut);font-size:14px}
.ed{background:var(--field);padding:14px;display:grid;gap:12px}
.prog{border-top:4px solid var(--ink);padding-top:12px;margin-top:22px}
.prog:first-child{margin-top:4px}
.ptop{display:flex;gap:8px;align-items:center}
.ptop input{font-weight:800;font-size:18px}
.item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.item .tools{display:flex;gap:4px}
.ib{min-width:44px;min-height:44px;border:0;background:var(--field);color:var(--ink);border-radius:10px;font:700 16px Archivo,sans-serif;cursor:pointer;padding:0 10px}
.ib:disabled{opacity:.3}
.move{min-height:44px;font-size:15px;margin-top:6px;padding:6px 10px}
.item .ed{grid-column:1/-1;border-radius:12px}
.e{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.empty{color:var(--mut);padding:14px 0}
.day{margin-top:20px}.day h3{font-size:15px;margin:0;color:var(--mut);font-weight:600}
.status{font-size:13px;color:var(--mut);margin-top:24px}
.small{display:flex;gap:10px;align-items:center;margin-bottom:12px}.small label{margin:0;white-space:nowrap}.small input{min-height:40px;max-width:200px}
button.bankchip{border-style:dashed}
.planbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}
.pname{font-size:19px;font-weight:800;font-stretch:108%;line-height:1.2}
.plan{border-top:1px solid var(--line);padding:14px 0;display:grid;gap:8px}
.plan .primary{flex:0 0 auto;min-height:48px}
.tag{font-size:13px;font-weight:700;color:var(--ok);white-space:nowrap}
.hname{background:none;border:0;padding:4px 0;font:inherit;font-weight:700;font-size:17px;color:var(--ink);text-align:left;text-decoration:underline;text-decoration-color:var(--mut);text-underline-offset:4px;cursor:pointer;min-height:36px}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin-top:10px}.two .add{margin-top:0}
.back{margin-bottom:12px}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <header><h1>Træningslog</h1><span class="date" id="today"></span></header>
  <nav>
    <button type="button" data-tab="train" aria-pressed="true">Træn</button>
    <button type="button" data-tab="prog" aria-pressed="false">Program</button>
    <button type="button" data-tab="hist" aria-pressed="false">Historik</button>
  </nav>

  <section id="v-train">
    <div class="chips" id="chips"></div>
    <div class="small"><label for="date">Dato</label><input id="date" type="date"></div>
    <ul id="trainList"></ul>
    <div id="extra"></div>
  </section>

  <section id="v-prog" hidden>
    <div id="progs"></div>
  </section>

  <section id="v-hist" hidden>
    <button class="ghost back" type="button" id="backAll" data-backall hidden>← Alle øvelser</button>
    <label for="filter">Vis</label>
    <select id="filter"></select>
    <div id="chartBox" hidden>
      <div class="chips" id="mchips"></div>
      <p class="msum" id="msum"></p>
      <div class="fig"><svg id="chart" role="img" aria-label="Udviklingsgraf"></svg></div>
      <p class="mnote" id="mnote"></p>
    </div>
    <div id="hist"></div>
    <h2>Backup</h2>
    <p class="meta">Dine data ligger kun på denne telefon. Gem en backup en gang imellem, og især før du skifter telefon.</p>
    <div class="row">
      <button class="ghost" type="button" id="exp">Gem backup</button>
      <button class="ghost" type="button" id="impBtn">Hent backup</button>
      <input type="file" id="imp" accept=".json,application/json" hidden>
    </div>
  </section>
  <p class="status" id="status"></p>
</div>

<script>
{
const $=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtKg=n=>(Math.round((+n||0)*100)/100).toString().replace('.',',');
const fmtPause=s=>{s=Math.round(+s||0);return Math.floor(s/60)+':'+pad(s%60)};
const fmtDate=d=>new Date(d+'T12:00').toLocaleDateString('da-DK',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
const shortDate=d=>new Date(d+'T12:00').toLocaleDateString('da-DK',{day:'numeric',month:'short'});
const num=v=>parseFloat(String(v).replace(',','.'))||0;
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const same=(a,b)=>String(a).trim().toLowerCase()===String(b).trim().toLowerCase();
const clone=o=>JSON.parse(JSON.stringify(o));
const norm=o=>{if(!Array.isArray(o.sets)){const n=Math.max(1,Math.round(+o.sets||1));o.sets=Array.from({length:n},()=>({kg:+o.kg||0,reps:Math.round(+o.reps||0)}))}delete o.kg;delete o.reps;o.pause=Math.round(+o.pause||0);o.uni=!!o.uni;if(o.uni)o.pauseSide=o.pauseSide==null?180:Math.round(+o.pauseSide||0);return o};
const sumTxt=(v,html)=>{const s=v.sets||[];if(!s.length)return'';const k=x=>x==null?'–':+x?fmtKg(x)+(html?' <small>kg</small>':' kg'):'BW';const r=x=>x==null?'–':x;
  return s.every(x=>x.kg===s[0].kg)?`${k(s[0].kg)} · ${s.map(x=>r(x.reps)).join(' / ')} ${html?'<small>reps'+(v.uni?' pr. side':'')+'</small>':'reps'+(v.uni?' pr. side':'')}`:s.map(x=>(x.kg==null?'–':+x.kg?fmtKg(x.kg):'BW')+'×'+r(x.reps)).join(' / ')+(v.uni&&!s.every(x=>x.kg===s[0].kg)?' pr. side':'')};
const ORD={side:'én side ad gangen',alt:'skift side hvert sæt'};
const pzTxt=(v,plain)=>{const w=t=>plain?t:`<span style="white-space:nowrap">${t}</span>`;return v.uni&&v.order==='alt'?w(`pause ${fmtPause(v.pause)} ved hvert sideskift`):v.uni?w(`pause ${fmtPause(v.pause)} mellem sæt`)+' · '+w(`${fmtPause(v.pauseSide)} mellem sider`):w(`pause ${fmtPause(v.pause)}`)};
const nums=v=>`<span class="nums">${sumTxt(v,true)}</span>`;

/* ---------- lagring ---------- */
const KE='traeningslog-v1',KP='traeningslog-programmer-v1',KA='traeningslog-aktiv',KPA='traeningslog-aktiv-program',KPL='traeningslog-planer-v1',KD='traeningslog-kladde';
const load=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}};
const save=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){$('status').textContent='Kunne ikke gemme – telefonens lager er måske fyldt.'}};
let entries=load(KE,[]),active=load(KA,null),pActive=load(KPA,null);
let store=load(KPL,null);
if(!store||!Array.isArray(store.plans)||!store.plans.length){const id=uid();store={plans:[{id,name:'Mit program',days:load(KP,[])}],activePlan:id,bank:[]}}
let plans=store.plans,activePlan=store.activePlan;const bank=Array.isArray(store.bank)?store.bank:[];
if(!plans.find(p=>p.id===activePlan))activePlan=plans[0].id;
const curPlan=()=>plans.find(p=>p.id===activePlan);
let programs=curPlan().days;
entries.forEach(norm);plans.forEach(pl=>pl.days.forEach(p=>p.items.forEach(norm)));bank.forEach(norm);
const BANK='bank',bankDay=()=>({id:BANK,name:'Øvelsesbank',items:bank});
const saveE=()=>save(KE,entries);
const saveP=()=>{curPlan().days=programs;save(KPL,{plans,activePlan,bank})};
saveP();

const todayIso=iso(new Date());
let tab='train',open=null,editItem=null,sure=null,draft=null,planView=false;
$('today').textContent=new Date().toLocaleDateString('da-DK',{weekday:'long',day:'numeric',month:'long'});
$('date').value=todayIso;
const dateSel=()=>$('date').value||todayIso;

/* ---------- kladde under Træn ---------- */
const persistDraft=()=>{if(tab==='train'&&open&&draft)save(KD,{open,draft,date:dateSel(),prog:active})};
const clearDraft=()=>{try{localStorage.removeItem(KD)}catch(e){}};
function restoreDraft(){if(open)return;if(!programs.find(p=>p.id===active))active=programs[0]?.id||null;const s=load(KD,null);if(!s||!s.draft||s.date!==dateSel()||s.prog!==active)return;if(s.open==='extra'||s.open==='new'||findItem(s.open).it){open=s.open;draft=s.draft}}

/* ---------- felter ---------- */
const stp=(i,k,v,st,m)=>`<div class="step"><button type="button" data-step="-${st}" data-i="${i}" data-k="${k}" aria-label="Mindre">−</button><input data-i="${i}" data-k="${k}" inputmode="${m}" aria-label="${k==='kg'?'Vægt':k==='reps'?'Reps':'Pause'}" value="${v==null||v===''?'':k==='kg'?fmtKg(v):Math.round(+v||0)}"><button type="button" data-step="${st}" data-i="${i}" data-k="${k}" aria-label="Mere">+</button></div>`;
const editor=mode=>`${mode==='prog'?`<div class="chips"><button type="button" data-uni aria-pressed="${!!draft.uni}">${draft.uni?'✓ ':''}Unilateral</button></div>`:''}
  ${(mode==='train'||mode==='prog')&&draft.uni?`<div><label>Rækkefølge</label><div class="chips">${Object.keys(ORD).map(k=>`<button type="button" data-order="${k}" aria-pressed="${draft.order===k}">${ORD[k][0].toUpperCase()+ORD[k].slice(1)}</button>`).join('')}</div></div>`:''}
  <div class="sets"><div class="sh"><span>Sæt</span><span>Vægt (kg)</span><span>${draft.uni?'Reps pr. side':'Reps'}</span></div>${draft.sets.map((x,i)=>`<div class="sr"><span class="sn">${i+1}</span>${stp(i,'kg',x.kg,2.5,'decimal')}${stp(i,'reps',x.reps,1,'numeric')}</div>`).join('')}
  <div class="row"><button class="ghost" type="button" data-addset>+ Sæt</button>${draft.sets.length>1?'<button class="ghost" type="button" data-rmset>− Sæt</button>':''}</div></div>
  ${draft.uni&&draft.order==='alt'?`<div class="pz"><label>Pause ved hvert sideskift (sek)</label>${stp(-1,'pause',draft.pause,15,'numeric')}</div>`:draft.uni?`<div class="pz"><label>Pause mellem sæt (sek)</label>${stp(-1,'pause',draft.pause,15,'numeric')}</div><div class="pz"><label>Pause mellem sider (sek)</label>${stp(-2,'pauseSide',draft.pauseSide,15,'numeric')}</div>`
  :`<div class="pz"><label>Pause (sek)</label>${stp(-1,'pause',draft.pause,15,'numeric')}</div>`}`;
const noteField=(k,lbl,add)=>draft[k]||draft['_'+k]?`<div><label for="n-${k}">${lbl}</label><textarea id="n-${k}" data-k="${k}" placeholder="Skriv en note …">${esc(draft[k]||'')}</textarea></div>`:`<button class="ghost addnote" type="button" data-addnote="${k}">+ ${add}</button>`;
const nameField=(id,ph)=>`<div><label for="${id}">Øvelse</label><input id="${id}" data-k="name" list="${id}-l" placeholder="${ph}" value="${esc(draft.name)}" autocomplete="off"><datalist id="${id}-l">${names().map(n=>`<option value="${esc(n)}">`).join('')}</datalist></div>`;
const dget=(i,k)=>i===-1?draft.pause:i===-2?draft.pauseSide:draft.sets[i][k];
const dset=(i,k,v)=>{v=k==='kg'?Math.round(v*100)/100:Math.round(v);if(i===-1)draft.pause=v;else if(i===-2)draft.pauseSide=v;else draft.sets[i][k]=v};
const lastBefore=(name,date)=>entries.filter(e=>same(e.name,name)&&e.date<date).sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:a.ts-b.ts).pop();
const lastLine=l=>l?`Sidst (${shortDate(l.date)}): ${sumTxt(l)} · ${pzTxt(l,true)}${l.uni&&l.order?' · '+ORD[l.order]:''}`+(l.note?` · Note: ${esc(l.note)}`:''):'Ikke lavet før';
const names=()=>[...new Set([...entries.map(e=>e.name),...programs.flatMap(p=>p.items.map(i=>i.name)),...bank.map(b=>b.name)].filter(Boolean))].sort((a,b)=>a.localeCompare(b,'da'));

/* ---------- Træn ---------- */
function renderTrain(){
  if(!programs.find(p=>p.id===active))active=programs[0]?.id||null;
  $('chips').innerHTML=programs.map(p=>`<button type="button" data-prog="${p.id}" aria-pressed="${p.id===active}">${esc(p.name)}</button>`).join('');
  const d=dateSel(),prog=programs.find(p=>p.id===active);
  const today=entries.filter(e=>e.date===d);
  if(!prog){$('trainList').innerHTML='<li class="empty">Du har ingen dage i dit program endnu. Opret dem under <b>Program</b>.</li>'}
  else if(!prog.items.length){$('trainList').innerHTML='<li class="empty">Der er ingen øvelser på denne dag endnu. Tryk <b>+ Ny øvelse</b> nedenfor, eller tilføj dem under <b>Program</b>.</li>'}
  else $('trainList').innerHTML=prog.items.map((it,ix)=>{
    const done=today.find(e=>same(e.name,it.name)),last=lastBefore(it.name,d);
    return `<li class="card ${done?'done':''}"><div class="crow"><button type="button" class="head" data-open="${it.id}" aria-expanded="${open===it.id}">
      <span class="tick"></span><span class="name">${esc(it.name)}</span>${it.note?`<span class="fnote">${esc(it.note)}</span>`:''}
      <span>${done?nums(done)+' <span class="meta">· udført</span>':nums(it)+' <span class="meta">· '+pzTxt(it)+'</span>'}</span>
      <span class="meta">${lastLine(last)}</span></button>
      <div class="ctools"><button class="ib" type="button" data-up="${it.id}" ${ix===0?'disabled':''} aria-label="Flyt op">↑</button><button class="ib" type="button" data-down="${it.id}" ${ix===prog.items.length-1?'disabled':''} aria-label="Flyt ned">↓</button></div></div>
      ${open===it.id?`<div class="ed">${editor('train')}${noteField('dnote','Note til i dag','Tilføj note')}<div class="row"><button class="primary" type="button" data-done="${it.id}">${done?'Gem ændring':'Udført'}</button>${done?`<button class="ghost" type="button" data-undo="${done.id}">Fortryd</button>`:''}</div></div>`:''}</li>`;
  }).join('');
  const other=today.filter(e=>!prog||!prog.items.some(it=>same(it.name,e.name)));
  let form='';
  if(open==='new'&&prog)form=`<div class="card"><div class="ed"><p class="meta" style="margin:0">Ny øvelse i <b>${esc(prog.name)}</b>. Den bliver sat ind efter den sidste øvelse, du har lavet i dag.</p>${nameField('x-name','F.eks. Pallof press')}${editor('prog')}${noteField('note','Fast note','Tilføj fast note')}<div class="row"><button class="primary" type="button" data-savenew>Tilføj til programmet</button><button class="ghost" type="button" data-close>Annullér</button></div></div></div>`;
  else if(open==='extra')form=`<div class="card"><div class="ed"><p class="meta" style="margin:0">Ekstra øvelse, der kun gælder i dag.</p>${nameField('x-name','F.eks. Biceps curl')}${editor('extra')}${noteField('dnote','Note til i dag','Tilføj note')}<div class="row"><button class="primary" type="button" data-saveextra>Gem</button><button class="ghost" type="button" data-close>Annullér</button></div></div></div>`;
  else form=`<div class="two">${prog?'<button class="ghost add" type="button" data-opennew>+ Ny øvelse</button>':''}<button class="ghost add" type="button" data-openextra>+ Ekstra (kun i dag)</button></div>`;

/* ---------- Historik ---------- */
const METRICS={kg:['Tungeste vægt','kg'],vol:['Volumen','kg'],e1rm:['Estimeret 1RM','kg'],best:['Reps i bedste sæt','reps'],tot:['Reps i alt','reps']};
const NOTES={kg:'Den højeste vægt i et sæt pr. pas.',vol:'Vægt × reps lagt sammen for alle sæt i passet.',e1rm:'Beregnet ud fra dit bedste sæt med Epley-formlen: vægt × (1 + reps/30). Et estimat, mest præcist ved få reps.',best:'Flest reps i ét sæt pr. pas.',tot:'Alle reps i passet lagt sammen.'};
let metric=null,chartData=null;
function series(name){
  const by={};entries.filter(e=>e.name===name).forEach(e=>(by[e.date]=by[e.date]||[]).push(...(e.sets||[]).filter(x=>x.reps!=null)));
  const ds=Object.keys(by).filter(d=>by[d].length).sort(),all=ds.flatMap(d=>by[d]),bw=all.every(x=>!(+x.kg));
  const keys=bw?['best','tot']:['kg','vol','e1rm'],m=keys.includes(metric)?metric:keys[0];
  const f={kg:s=>Math.max(...s.map(x=>+x.kg||0)),vol:s=>s.reduce((a,x)=>a+(+x.kg||0)*(+x.reps||0),0),e1rm:s=>Math.max(...s.map(x=>(+x.kg||0)*(1+(+x.reps||0)/30))),best:s=>Math.max(...s.map(x=>+x.reps||0)),tot:s=>s.reduce((a,x)=>a+(+x.reps||0),0)}[m];
  return{keys,m,pts:ds.map(d=>({d,v:Math.round(f(by[d])*10)/10}))};
}
function renderChart(name){
  const s=series(name);chartData=s;const u=METRICS[s.m][1];
  $('mchips').innerHTML=s.keys.map(k=>`<button type="button" data-metric="${k}" aria-pressed="${k===s.m}">${METRICS[k][0]}</button>`).join('');
  const p=s.pts,last=p[p.length-1],first=p[0];
  if(!last){$('msum').textContent='Ingen registrerede sæt endnu.';$('mnote').textContent='';drawChart();return}
  const df=Math.round((last.v-first.v)*10)/10;
  $('msum').innerHTML=`Seneste: <b>${fmtKg(last.v)} ${u}</b>`+(p.length>1?` <span class="meta">· ${df>=0?'+':'−'}${fmtKg(Math.abs(df))} ${u} siden ${shortDate(first.d)}</span>`:'');
  $('mnote').textContent=NOTES[s.m]+(p.length<2?' Grafen viser en udvikling, når du har mindst to pas.':'');
  drawChart();
}
function drawChart(){
  const svg=$('chart'),W=svg.clientWidth,H=svg.clientHeight;if(!W||!chartData)return;
  const p=chartData.pts;if(!p.length){svg.innerHTML='';return}
  const L=44,R=14,T=12,B=26;let mn=Math.min(...p.map(x=>x.v)),mx=Math.max(...p.map(x=>x.v));const tv=mn===mx?[mn]:[mn,(mn+mx)/2,mx];
  if(mn===mx){mn-=Math.max(1,mn*.1);mx+=Math.max(1,mx*.1)}const pd=(mx-mn)*.08;mn=Math.max(0,mn-pd);mx+=pd;
  const x=i=>p.length===1?(L+W-R)/2:L+i*(W-L-R)/(p.length-1),y=v=>T+(mx-v)*(H-T-B)/(mx-mn);
  const ticks=tv.map(v=>`<line class="gl" x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}"/><text class="ax" x="${L-6}" y="${y(v)+4}" text-anchor="end">${fmtKg(Math.round(v*10)/10)}</text>`).join('');
  const xl=p.length>1?`<text class="ax" x="${x(0)}" y="${H-6}">${shortDate(p[0].d)}</text><text class="ax" x="${x(p.length-1)}" y="${H-6}" text-anchor="end">${shortDate(p[p.length-1].d)}</text>`:`<text class="ax" x="${x(0)}" y="${H-6}" text-anchor="middle">${shortDate(p[0].d)}</text>`;
  svg.innerHTML=ticks+(p.length>1?`<polyline class="ln" points="${p.map((q,i)=>x(i)+','+y(q.v)).join(' ')}"/>`:'')+p.map((q,i)=>`<circle class="pt" cx="${x(i)}" cy="${y(q.v)}" r="${p.length>40?3:4.5}"><title>${shortDate(q.d)}: ${fmtKg(q.v)}</title></circle>`).join('')+xl;
}
const chartRO=new ResizeObserver(drawChart);chartRO.observe($('chart'));
function renderHist(){
  const cur=$('filter').value,n=[...new Set(entries.map(e=>e.name))].sort((a,b)=>a.localeCompare(b,'da'));

}

    const data=JSON.parse(await file.text());
    const inE=Array.isArray(data)?data:(data.entries||[]);let what;
    const me=new Map(entries.map(e=>[e.id,e]));inE.filter(e=>e&&e.id&&e.name&&e.date).forEach(e=>me.set(e.id,e));entries=[...me.values()].map(norm);
    if(!Array.isArray(data)&&Array.isArray(data.plans)){
      saveP();const blank=plans.length===1&&!plans[0].days.length&&!bank.length;if(blank)plans=[];const mp=new Map(plans.map(p=>[p.id,p]));const inPl=data.plans.filter(p=>p&&p.id&&Array.isArray(p.days));
      inPl.forEach(p=>{p.days.forEach(x=>(x.items=x.items||[]).forEach(norm));mp.set(p.id,p)});plans=[...mp.values()];
      if(Array.isArray(data.bank)){const mb=new Map(bank.map(x=>[x.id,x]));data.bank.filter(x=>x&&x.id&&x.name).forEach(x=>mb.set(x.id,norm(x)));bank.splice(0,bank.length,...mb.values())}
      if(!plans.length)plans=[{id:uid(),name:'Mit program',days:[]}];if(blank||!plans.find(p=>p.id===activePlan))activePlan=plans.find(p=>p.id===data.activePlan)?data.activePlan:plans[0].id;
      programs=curPlan().days;what=`${inPl.length} ${inPl.length===1?'program':'programmer'}`;
    }else{
      const inP=Array.isArray(data)?[]:(data.programs||[]);
      const mp=new Map(programs.map(p=>[p.id,p]));inP.filter(p=>p&&p.id&&Array.isArray(p.items)).forEach(p=>mp.set(p.id,p));programs=[...mp.values()];programs.forEach(p=>p.items.forEach(norm));
      what=`${inP.length} dage`;
    }
    saveE();saveP();render();
    $('status').textContent=`Backup hentet: ${what} og ${inE.length} registrerede øvelser.`;
  }catch(e){$('status').textContent='Filen kunne ikke læses som backup.'}
  $('imp').value='';
});

if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
restoreDraft();render();
}
</script>
